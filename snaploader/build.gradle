plugins {
    // Apply the java-library plugin for API and implementation separation.
    id 'java-library'
}

// Updated: Use the type-safe task registration syntax and replace lazy property `.from` references
// with exact task target mapping to ensure Configuration Cache compliance.
tasks.register("generateJavadocJar", Jar) {
    archiveClassifier.set("javadoc")
    from tasks.named('javadoc')
}

tasks.register("generateSourcesJar", Jar) {
    archiveClassifier.set("sources")
    from sourceSets.main.allSource
}

tasks.withType(JavaCompile).configureEach {
    // Updated: In Gradle 9+, compiler options (like release) use lazy Property types.
    // They must be assigned via .set() rather than raw assignment.
    options.release.set(9)
}

jar {
    manifest {
        // Updated: Replaced project.name string mutation inside the manifest block
        // to directly read the property without relying on dynamic Groovy resolution.
        attributes 'Project': "jSnaploader",
                'Version': "${version}",
                'Automatic-Module-Name': project.name.replace("-", "."),
                'Compiled-by': JavaVersion.current()
    }
}

dependencies {
    // Standardized api configuration notation for Gradle 9/10
    api 'com.github.oshi:oshi-core:7.7.0'
}
java {
    sourceCompatibility = JavaVersion.VERSION_1_9
    targetCompatibility = JavaVersion.VERSION_1_9
}