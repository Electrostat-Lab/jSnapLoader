plugins {
    id 'com.android.application'
}

android {
    namespace 'electrostat.lab.snaploaderapp'
    compileSdk 37

    defaultConfig {
        applicationId "electrostat.lab.snaploaderapp"
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName "1.0"

        // Updated from deprecated android.support.test to androidx.test
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        // Gradle 9/10 require modern Java versions (Java 17 or Java 21) for the build environment,
        // but you can still target Java 8 or Java 11 for Android compatibility.
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Updated: packagingOptions is deprecated and removed in AGP 9.0+. Use packaging instead.
    packaging {
        resources {
            excludes += '/META-INF/AL2.0'
            excludes += '/META-INF/LGPL2.1'
        }
    }
}

dependencies {
    // Updated: Changed the deprecated/removed syntax of project exclusions to the modern lazy configuration layout
    implementation(project(':snaploader')) {
        exclude group: 'com.github.oshi', module: 'oshi-core'
    }

    implementation 'net.java.dev.jna:jna:5.19.1@aar'

    implementation 'io.github.software-hardware-codesign:jme3-alloc-android:1.0.0-pre-gamma-2'

    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
