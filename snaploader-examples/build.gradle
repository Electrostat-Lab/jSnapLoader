plugins {
    id 'application'
}

// Configuration Properties for Directories
// Note: Kept path structure clean without eager runtime os-checks during configuration phase
def dependenciesDir = layout.buildDirectory.dir("libs/dependencies").get().asFile.absolutePath
def libsDir = project(':snaploader').layout.buildDirectory.dir("libs").get().asFile.absolutePath

application {
    // Updated: In Gradle 9+, mainClass is a lazy Property and should be assigned cleanly
    mainClass.set('electrostatic4j.snaploader.examples.TestBasicFeatures')
}

// Helper method to eliminate duplicate boilerplate for registering executable example tasks
def registerExampleTask(String taskName, String mainClassName) {
    tasks.register(taskName, JavaExec) {
        group = 'application'
        description = "Runs the ${taskName} example app."
        classpath = sourceSets.main.runtimeClasspath
        mainClass.set(mainClassName)
    }
}

// Updated: Converted all plain tasks that previously mutated a global variable into proper standalone JavaExec tasks.
registerExampleTask("TestBasicFeatures", 'electrostatic4j.snaploader.examples.TestBasicFeatures')
registerExampleTask("TestBasicFeatures2", 'electrostatic4j.snaploader.examples.TestBasicFeatures2')
registerExampleTask("TestCpuFeatures", 'electrostatic4j.snaploader.examples.TestCpuFeatures')
registerExampleTask("MonitorableExample", 'electrostatic4j.snaploader.examples.MonitorableExample')
registerExampleTask("ReflectiveLauncher", 'electrostatic4j.snaploader.examples.ReflectiveLauncher')
registerExampleTask("TestMultipleLoads", 'electrostatic4j.snaploader.examples.TestMultipleLoads')
registerExampleTask("TestZipExtractor", 'electrostatic4j.snaploader.examples.TestZipExtractor')
registerExampleTask("TestMultiThreading", 'electrostatic4j.snaploader.examples.TestMultiThreading')
registerExampleTask("TestRetryExhaustionException", 'electrostatic4j.snaploader.examples.TestRetryExhaustionException')

// Updated: Changed legacy "task name(type: Copy)" layout to modern "tasks.register" syntax
tasks.register("copyLibs", Copy) {
    from(libsDir) {
        include '**/*.jar'
    }
    into(dependenciesDir)
    includeEmptyDirs = false
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Updated: Changed legacy task declaration and moved imperative file-system reading
// inside "doFirst" block to make it fully compatible with Gradle 9+ Configuration Caching.
tasks.register("createJar", Jar) {
    dependsOn(tasks.named('copyLibs'))

    // Mixin the base jar behaviors cleanly using modern named task mapping
    from(sourceSets.main.output)

    doFirst {
        String dependenciesString = ""
        File dependenciesFolder = new File(dependenciesDir)
        if (dependenciesFolder.exists()) {
            File[] files = dependenciesFolder.listFiles()
            if (files != null && files.length > 0) {
                for (File file : files) {
                    String fileName = file.getName()
                    if (fileName.endsWith(".jar")) {
                        dependenciesString += "dependencies/" + fileName + " "
                    }
                }
            }
        }

        manifest {
            attributes 'Project': 'snaploader-examples',
                    'Automatic-Module-Name': project.name.replace("-", "."),
                    'Compiled-by': JavaVersion.current(),
                    'Class-Path': dependenciesString.trim(),
                    'Main-Class': application.mainClass.get()
        }
    }
}

dependencies {
    implementation project(':snaploader')
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.26.1'

    implementation 'com.github.stephengold:jolt-jni-Linux64:6.1.1'
    runtimeOnly 'com.github.stephengold:jolt-jni-Linux64:6.1.1:DebugSp'
    runtimeOnly 'com.github.stephengold:jolt-jni-Linux64_fma:6.1.1:DebugSp'
    runtimeOnly 'com.github.stephengold:jolt-jni-Windows64:6.1.1:DebugSp'
    runtimeOnly 'com.github.stephengold:jolt-jni-Windows64_avx2:6.1.1:DebugSp'
    runtimeOnly 'io.github.software-hardware-codesign:jme3-alloc-desktop:1.0.0-pre-gamma-2'
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}